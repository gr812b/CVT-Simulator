server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container-health endpoint; it does not depend on the backend.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # CINDER v1 API. Do not add legacy /run, /constants, /ramp, or /solvers
    # routes here: they are intentionally removed from the frontend contract.
    # No trailing slash on proxy_pass preserves /api/v1/... exactly.
    location ^~ /api/v1/ {
        proxy_pass http://cvt-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Backend runs may legitimately approach their 120 s application timeout.
        # Keep the proxy timeout above that so nginx is not the component that
        # terminates an otherwise-valid request first.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Optional backend documentation endpoints, useful on the deployed stack.
    location = /docs {
        proxy_pass http://cvt-backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /docs/ {
        proxy_pass http://cvt-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://cvt-backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed assets, so they can be cached aggressively.
    location ~* \.(?:js|mjs|css|map|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
