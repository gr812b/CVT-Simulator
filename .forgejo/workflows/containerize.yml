# name of the workflow.
# this is optional.
name: Contiaerize

# events that will trigger this workflow.
# here, we only have "pull_request", so the workflow will run
# whenever we create a pull request.
# other examples: [push] and [pull_request, push]
on:
  push:
    branches:
      - develop

# each workflow must have at least one job.
# jobs run in parallel by default (we can change that).
# each job groups together a series of steps to accomplish a purpose.
jobs:
  # name of the job
  # ruffLint:
  #   # the platform or OS that the workflow will run on.
  #   runs-on: ubuntu-latest

  #   # series of steps to finish the job.
  #   steps:
  #     # name of the step.
  #     # steps run sequentially.
  #     # this is optionale
  #     - name: checkout
  #       # each step can either have "uses" or "run".
  #       # "uses" run an action written somewhere other than this workflow .
  #       # usually from the community.
  #       # this action checks out the repo code to the runner (instance)
  #       # running the action
  #       uses: actions/checkout@v3

  #     # another step.
  #     # this step runs a bash (Ubuntu's default shell) command
  #     - name: install ruff
  #       run: pip install ruff

  #     - name: Lint
  #       run: ruff check  --ignore E402

  deploy:
    runs-on: ubuntu
    # if: ${{ github.ref == 'refs/heads/master' || github.event.pull_request.merged == true }} # Runs if it's a push to 'main' or a merged PR to 'main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        # Login to Forgejo registry
      - name: Login to Forgejo Container Registry
        uses: docker/login-action@v2
        with:
          registry: forge.ucalgarybaja.ca
          username: ${{ secrets.FORGEJO_REGISTRY_USER }}
          password: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
        id: forgejo-login

      - name: build container image # build the container
        run: |
          cd backend
          docker compose build --no-cache
        id: docker-build

      - name: Upload to Forgejo with Git SHA tag
        run: |
          docker tag ucalgary-baja/cvt-simulator:latest forge.ucalgarybaja.ca/ucalgary-baja/cvt-simulator:${{ github.sha }}
          docker push forge.ucalgarybaja.ca/ucalgary-baja/cvt-simulator:${{ github.sha }}
        if: ${{ steps.forgejo-login.outcome == 'success' && steps.docker-build.outcome == 'success' }}

      - name: Upload to Forgejo
        run: |
          docker tag ucalgary-baja/cvt-simulator:latest forge.ucalgarybaja.ca/ucalgary-baja/cvt-simulator:latest
          docker push forge.ucalgarybaja.ca/ucalgary-baja/cvt-simulator:latest
        if: ${{ steps.forgejo-login.outcome == 'success' && steps.docker-build.outcome == 'success' }}
