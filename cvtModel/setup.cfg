[flake8]
max-line-length = 120
exclude =
    .git,
    .venv,
    build,
    dist,
    src/cvt_simulator,
    test/cvt_simulator
ignore = E203, E266, E501, W503

[tool:pytest]
testpaths =
    test/cinder
addopts = -ra

[coverage:run]
branch = True
source =
    cinder

[coverage:report]
show_missing = True
skip_covered = False
