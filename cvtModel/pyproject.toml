[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinder-cvt"
version = "1.0.0"
description = "Mechanics-first dynamic modelling for rubber V-belt continuously variable transmissions."
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
keywords = ["CVT", "V-belt", "variator", "mechanical simulation", "vehicle dynamics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "coverage>=7.0",
    "flake8>=7.0",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/gr812b/CVT-Simulator"
Source = "https://github.com/gr812b/CVT-Simulator/tree/cinder-v1.0.0/cvtModel"
Documentation = "https://github.com/gr812b/CVT-Simulator/tree/cinder-v1.0.0/cvtModel/docs"
Issues = "https://github.com/gr812b/CVT-Simulator/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["cinder", "cinder.*"]

[tool.setuptools.package-data]
cinder = ["py.typed"]
