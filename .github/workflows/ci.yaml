name: CI for CVT Simulator

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  simulator-tests:
    name: CINDER Lint & Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CINDER and development tools
        working-directory: ./cvtModel
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run flake8
        working-directory: ./cvtModel
        run: |
          source venv/bin/activate
          python -m flake8 src test/smoke

      - name: Run Black check
        working-directory: ./cvtModel
        run: |
          source venv/bin/activate
          python -m black --check src test/smoke

      - name: Run CINDER smoke tests with coverage
        working-directory: ./cvtModel
        run: |
          source venv/bin/activate
          python -m coverage run -m pytest test/smoke
          python -m coverage report

  backend-tests:
    name: Backend Lint, Contracts & Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies and development tools
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "black>=24" "flake8>=7"

      - name: Verify backend uses the pinned published CINDER
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m pip check
          python -m app.scripts.check_cinder_install

      - name: Validate database migrations
        working-directory: ./backend
        run: |
          source venv/bin/activate
          rm -f /tmp/cvt-simulator-ci.db
          CVT_DATABASE_URL=sqlite:////tmp/cvt-simulator-ci.db alembic upgrade head

      - name: Run flake8
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m flake8 app

      - name: Run Black check
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m black --check app

      - name: Compile backend modules
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m compileall -q app

      - name: Run backend regression tests
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m pip install -r requirements-dev.txt
          python -m pytest

      - name: Verify bundled tuned-launch preset
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python - <<'PY'
          from pathlib import Path

          from app.storage.preset_store import JsonPresetStore

          preset = JsonPresetStore(Path("presets")).get("baja-launch-baseline")
          assert preset.simulation_case["scenario"]["time_span_s"] == [0.0, 30.0]
          print("Verified baja-launch-baseline preset with a 30.0 s scenario.")
          PY

      - name: Export backend contract artifacts
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m app.scripts.export_contract_artifacts --output-dir generated

      - name: Upload backend contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-contract-artifacts
          path: backend/generated
          if-no-files-found: error

  postgres-smoke:
    name: PostgreSQL Migrations & Seed
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cvt_simulator
          POSTGRES_USER: cvt
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvt -d cvt_simulator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # Isolated CI database and application settings; no real mail credentials.
    env:
      CVT_DATABASE_URL: postgresql+psycopg://cvt:ci-only-password@127.0.0.1:5432/cvt_simulator
      CVT_ENVIRONMENT: production
      CVT_WEB_URL: https://cinder.example
      CVT_CORS_ORIGINS: https://cinder.example
      CVT_MAIL_MODE: smtp
      CVT_SMTP_HOST: smtp.example
      CVT_SMTP_FROM: cinder@example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up production Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend runtime dependencies
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -m app.scripts.check_cinder_install

      - name: Migrate a fresh PostgreSQL database and verify repeatable seeding
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m alembic upgrade head
          python -m app.scripts.init_database
          python -m app.scripts.init_database

      - name: Verify concurrent queue ownership on PostgreSQL
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m pip install -r requirements-dev.txt
          CVT_TEST_POSTGRES_URL="$CVT_DATABASE_URL" python -m pytest test/test_worker_queue_concurrency.py

  web-tests:
    name: Frontend Lint, Regression Tests & Build
    needs: backend-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download backend contract artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-contract-artifacts
          path: backend/generated

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate frontend contracts
        run: npm --prefix frontend run contracts:generate

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend helper checks
        working-directory: ./frontend
        run: npm run test:helpers

      - name: Install test browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run saved-tune browser regressions
        working-directory: ./frontend
        run: npm run test:browser

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          if-no-files-found: error

  container-builds:
    name: Production images (build only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build backend image
        run: docker build --pull --build-arg CVT_IMAGE_REVISION="$GITHUB_SHA" -f backend/Dockerfile -t cinder-ci-backend .

      - name: Check packaged CINDER and retained demo
        run: |
          docker run --rm --network none -e EXPECTED_REVISION="$GITHUB_SHA" cinder-ci-backend python -c "import os; from app.core.deployment import image_revision; assert image_revision() == os.environ['EXPECTED_REVISION']; print('Image revision verified')"
          docker run --rm --network none cinder-ci-backend python -m app.scripts.check_cinder_install
          docker run --rm --network none cinder-ci-backend python -c "from app.application.demo import playback, scene; assert playback().result['metrics']['completed']; scene(); print('Retained demo and landing scene loaded')"

      - name: Build frontend image
        run: docker build --pull -f frontend/Dockerfile -t cinder-ci-frontend .
