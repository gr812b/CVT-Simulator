name: CI for CVT Simulator

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  simulator-tests:
    name: Simulation Module Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -e .[dev]
        working-directory: ./cvtModel

      - name: Run flake8
        run: |
          source venv/bin/activate
          flake8 src test
        working-directory: ./cvtModel

      - name: Run black (check)
        run: |
          source venv/bin/activate
          black --check src test
        working-directory: ./cvtModel

      - name: Run Python unit tests
        run: |
          source venv/bin/activate
          coverage run -m unittest discover -s test/simulations -s test/utils
        working-directory: ./cvtModel
          
      - name: Generate coverage report
        run: |
          source venv/bin/activate
          coverage report

          python -m unittest discover -s test
        working-directory: ./cvtModel

  backend-tests:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
        working-directory: ./backend

      - name: Run flake8
        run: |
          source venv/bin/activate
          flake8 app
        working-directory: ./backend

      - name: Run black (check)
        run: |
          source venv/bin/activate
          black --check app
        working-directory: ./backend

      - name: Run compiler
        run: |
          source venv/bin/activate
          python -m compileall app/
        working-directory: ./backend

  web-tests:
    name: Web Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: ./frontend
      
      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/dist
          
