name: Containerize

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Non-latest tag to publish for this manual build (for example pr-459)"
        required: true
        default: "manual"
        type: string

concurrency:
  group: containerize-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_GH: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cvt-simulator-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cvt-simulator-frontend

jobs:
  deploy:
    name: Build and publish container images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify container build inputs
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "cvtModel/setup.py"
            "cvtModel/setup.cfg"
            "backend/Dockerfile"
            "frontend/Dockerfile"
            "frontend/package-lock.json"
            "frontend/nginx.conf"
          )

          for file in "${required_files[@]}"; do
            [[ -f "$file" ]] || {
              echo "::error file=$file::Missing required container build input: $file"
              exit 1
            }
          done

      - name: Choose published image tag
        id: image-tag
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="latest"
          else
            tag="${MANUAL_TAG}"

            if [[ "$tag" == "latest" ]]; then
              echo "::error::Manual builds may not overwrite the latest tag."
              exit 1
            fi
          fi

          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid container tag '$tag'."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing image tag: $tag"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GH }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          pull: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cvt-backend
          cache-to: type=gha,mode=max,scope=cvt-backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          pull: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cvt-frontend
          cache-to: type=gha,mode=max,scope=cvt-frontend
