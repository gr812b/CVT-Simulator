name: Containerize

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Non-latest tag to publish for this manual build"
        required: true
        default: "manual"
        type: string

concurrency:
  group: containerize-${{ github.workflow }}-${{ github.ref }}
  # Finish publishing the current image pair before a newer release starts.
  cancel-in-progress: false

env:
  REGISTRY_GH: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cvt-simulator-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cvt-simulator-frontend

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  deploy:
    name: Build and publish container images
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify container build inputs
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "backend/Dockerfile"
            "backend/requirements.txt"
            "frontend/Dockerfile"
            "frontend/package-lock.json"
            "frontend/nginx.conf"
          )

          for file in "${required_files[@]}"; do
            [[ -f "$file" ]] || {
              echo "::error file=$file::Missing required container build input: $file"
              exit 1
            }
          done

      - name: Choose published image tag
        id: image-tag
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="latest"
          else
            tag="${MANUAL_TAG}"

            if [[ "$tag" == "latest" ]]; then
              echo "::error::Manual builds may not overwrite the latest tag."
              exit 1
            fi
          fi

          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid container tag '$tag'."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing image tag: $tag"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GH }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend (hold publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          build-args: |
            CVT_IMAGE_REVISION=${{ github.sha }}
          push: false
          load: true
          pull: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cvt-backend
          cache-to: type=gha,mode=max,scope=cvt-backend

      - name: Build frontend (hold publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          load: true
          pull: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cvt-frontend
          cache-to: type=gha,mode=max,scope=cvt-frontend

      # CI and both builds must succeed before either component is published.
      # Registry tag pushes are separate: keep normal releases compatible during
      # the brief period in which Watchtower can observe different image tags.
      - name: Check built backend before publication
        env:
          IMAGE: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
        run: |
          docker run --rm --network none -e EXPECTED_REVISION="$GITHUB_SHA" "$IMAGE" python -c "import os; from app.core.deployment import image_revision; assert image_revision() == os.environ['EXPECTED_REVISION']; print('Image revision verified')"
          docker run --rm --network none "$IMAGE" python -m app.scripts.check_cinder_install
          docker run --rm --network none "$IMAGE" python -c "from app.application.demo import playback, scene; assert playback().result['metrics']['completed']; scene(); print('Retained demo and landing scene loaded')"

      - name: Publish both built images
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Upload the commit-addressed pair before advancing the friendly tag.
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"
          docker push "${FRONTEND_IMAGE}:${GITHUB_SHA}"
          if [[ "${IMAGE_TAG}" != "${GITHUB_SHA}" ]]; then
            docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"
            docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}"
          fi
