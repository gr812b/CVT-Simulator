name: Containerize

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: containerize-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_GH: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cvt-simulator-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cvt-simulator-frontend

jobs:
  deploy:
    name: Build container images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify container build inputs
        shell: bash
        run: |
          set -uo pipefail

          required_files=(
            "cvtModel/setup.py"
            "cvtModel/setup.cfg"
            "backend/Dockerfile"
            "frontend/Dockerfile"
            "frontend/package-lock.json"
            "frontend/nginx.conf"
          )

          missing_files=()
          untracked_files=()

          echo "Repository root: $(pwd)"
          echo "Checked-out commit: $(git rev-parse --short HEAD)"
          echo

          for file in "${required_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "Found on runner: $file"
            else
              echo "::error file=$file::Missing from the checked-out runner filesystem: $file"
              missing_files+=("$file")
            fi

            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              echo "Tracked in this commit: $file"
            else
              echo "::warning file=$file::Not tracked in this checked-out commit: $file"
              untracked_files+=("$file")
            fi

            echo
          done

          echo "Relevant files visible to GitHub Actions:"
          for directory in cvtModel backend frontend; do
            echo "--- $directory ---"
            if [[ -d "$directory" ]]; then
              find "$directory" -maxdepth 2 -type f | sort
            else
              echo "Directory not present"
            fi
          done

          if (( ${#missing_files[@]} > 0 )); then
            echo
            echo "Missing required files:"
            printf '  - %s\n' "${missing_files[@]}"

            if (( ${#untracked_files[@]} > 0 )); then
              echo
              echo "Files not tracked in this commit:"
              printf '  - %s\n' "${untracked_files[@]}"
            fi

            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests and workflow_dispatch runs build only. Only pushes to develop
      # publish image tags, so PR verification cannot overwrite deployed images.
      - name: Log into GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GH }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The backend needs repository-root context because it installs cvtModel.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          pull: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cvt-backend
          cache-to: type=gha,mode=max,scope=cvt-backend

      # The frontend uses a narrow Docker context, keeping unrelated repository files
      # out of the Docker build context while preserving frontend/nginx.conf.
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          pull: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cvt-frontend
          cache-to: type=gha,mode=max,scope=cvt-frontend
