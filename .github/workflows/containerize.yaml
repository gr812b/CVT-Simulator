# name of the workflow.
# this is optional.
name: Containerize

on:
  push:
    branches:
      - '**' # develop # Set to '**' for testing on all branches
  workflow_dispatch: # Allow manual triggering

env:
  REGISTRY_GH: ghcr.io

#This also includes how I upload it to our forgejo instance, feel free to add or remove it to the github container registry
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GH }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_GH }}/${{ github.repository_owner }}/cvt-simulator:latest
            ${{ env.REGISTRY_GH }}/${{ github.repository_owner }}/cvt-simulator:${{ github.sha }}