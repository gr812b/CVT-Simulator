name: Chapter 4 editorial review PDF
on:
  push:
    branches:
      - review/ch4-results-editorial-pass-2026-11-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build manuscript with frozen figures
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CVT_Module_Formulation.tex
          working_directory: docs/CVT_Module_Formulation
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Extract Chapter 4 review and record page boundaries
        run: |
          python -m pip install --quiet pymupdf
          python - <<'PY'
          import fitz, re, json
          path = "docs/CVT_Module_Formulation/CVT_Module_Formulation.pdf"
          doc = fitz.open(path)
          headings = {}
          for i, p in enumerate(doc):
              if i < 140:
                  continue
              t = p.get_text("text")
              if "start" not in headings and "Independent Transient-Model Benchmark" in t:
                  headings["start"] = i
              if "start" in headings and i > headings["start"] + 9 and "Conclusion and Future Work" in t:
                  headings["end"] = i
                  break
          print(json.dumps({"total_pages": len(doc), "headings_zero_based": headings}))
          if "start" not in headings or "end" not in headings:
              print("Could not find both review boundaries; full manuscript will still be uploaded")
          else:
              start, end = headings["start"], headings["end"]
              if 5 < end-start < 100:
                  out=fitz.open()
                  out.insert_pdf(doc, from_page=start-1, to_page=end-1)
                  out.save("docs/CVT_Module_Formulation/Chapter4_Sections_4_3_to_4_5_Review.pdf", garbage=4, deflate=True)
              else:
                  print("Unexpected review span; retaining full PDF only")
          PY
      - name: Upload review PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter4-editorial-draft-pdfs
          path: |
            docs/CVT_Module_Formulation/Chapter4_Sections_4_3_to_4_5_Review.pdf
            docs/CVT_Module_Formulation/CVT_Module_Formulation.pdf
          retention-days: 30
